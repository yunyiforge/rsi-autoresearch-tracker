name: Deploy site to GitHub Pages

# 站点 = site/ 下的静态页面 + 最新的 data/ 与 reports/。
# - 每日采集完成后由 collect.yml 以 workflow_call 调用（GITHUB_TOKEN 推送的数据提交不会触发 push 事件）；
# - 修改 site/ 后推送到 main 也会重新部署；也可在 Actions 页面手动运行。
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # 采集 job 刚推送的最新数据提交，而不是触发时的 SHA

      - name: Build site
        run: ./site/build.sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
