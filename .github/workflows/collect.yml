name: Collect RSI & AutoResearch data

on:
  schedule:
    - cron: "17 1 * * *" # 每天 01:17 UTC（北京时间 09:17）
  workflow_dispatch:
    inputs:
      sources:
        description: "只采集指定数据源（逗号分隔：arxiv,github,hn,rss），留空表示全部"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tracker/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # 最新分支头，而不是触发时的 SHA，避免与上一次数据提交冲突

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Collect, build and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCES: ${{ github.event.inputs.sources }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(run)
          if [ -n "$SOURCES" ]; then args+=(--sources "$SOURCES"); fi
          for attempt in 1 2 3; do
            # 每次都基于远端最新数据增量构建；推送冲突时重新拉取并重建，而不是合并生成文件。
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            summary=()
            if [ "$attempt" = 1 ]; then summary=(--step-summary); fi
            python -m tracker "${args[@]}" "${summary[@]}" > /dev/null
            git add data reports
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit -q -m "data: update $(date -u +%Y-%m-%d) [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebuilding on latest $BRANCH..."
            sleep $((attempt * 10))
          done
          exit 1

  pages:
    needs: collect
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
