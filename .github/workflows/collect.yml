name: Collect RSI & AutoResearch data

on:
  schedule:
    - cron: "17 1 * * *" # 每天 01:17 UTC（北京时间 09:17）
  workflow_dispatch:
    inputs:
      sources:
        description: "只采集指定数据源（逗号分隔：arxiv,github,hn,rss），留空表示全部"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tracker/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Collect and build datasets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          args=(run --step-summary)
          if [ -n "$SOURCES" ]; then args+=(--sources "$SOURCES"); fi
          python -m tracker "${args[@]}" > /dev/null

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed, retrying ($i)..."
            sleep $((i * 5))
          done
          exit 1
